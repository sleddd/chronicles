<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/chronicles-logo.svg?v=3" />
    <link rel="alternate icon" href="/favicon.ico?v=3" />
    <!-- Light until the app starts: main.tsx switches to the remembered theme before it paints -->
    <meta name="theme-color" content="#f4f5f7" />
    <style>html { background: #f4f5f7; }</style>
    <meta name="description" content="Capture your day in seconds. Chronicles is a zero-knowledge encrypted digital planner featuring health tracking, calendar sync, and optional private AI." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <!-- Public pages (LegalTemplate) point this at their own address -->
    <link rel="canonical" href="https://mydailychronicles.com/" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- All fonts, the Material Symbols icons included, are bundled (src/styles/fonts.css) -->
    <title>Chronicles — Zero-Knowledge Encrypted Journal &amp; Digital Day Planner</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Who is Chronicles for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Chronicles is designed for people who want to track their daily activities, goals, health, and schedule quickly without the overhead of heavy journaling."
          }
        },
        {
          "@type": "Question",
          "name": "Is my data private on Chronicles?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Chronicles uses zero-knowledge AES-256 encryption on your device. Your data is encrypted before saving, and servers cannot read your entries."
          }
        },
        {
          "@type": "Question",
          "name": "Does Chronicles cost anything to join?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Chronicles is currently accepting signups for its private beta testing phase."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
