<!DOCTYPE html>
<html lang="en">

    <link rel="icon" type="image/svg+xml" href="/chronicles-logo.svg?v=11" />
    <link rel="alternate icon" href="/favicon.ico?v=11" />
    <!-- Light until the app starts: main.tsx switches to the remembered theme before it paints -->
    <meta name="theme-color" content="#f4f5f7" />
    <style>html { background: #f4f5f7; }</style>
    <meta name="description" content="Capture your day in seconds. Chronicles is a zero-knowledge encrypted digital planner featuring health tracking, calendar sync, and optional private AI." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <!-- Public pages (LegalTemplate) point this at their own address -->
    <link rel="canonical" href="https://mydailychronicles.com/" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=11" />
    <!-- All fonts, the Material Symbols icons included, are bundled (src/styles/fonts.css) -->
    <title>Chronicles — Zero-Knowledge Encrypted Journal &amp; Digital Day Planner</title>
    <meta name="application-name" content="Chronicles" />
    <meta name="author" content="Chronicles" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage, Slack… link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chronicles" />
    <meta property="og:url" content="https://mydailychronicles.com/" />
    <meta property="og:title" content="Chronicles — Zero-Knowledge Encrypted Journal &amp; Digital Day Planner" />
    <meta property="og:description" content="A private life dashboard: journal, health, planning, kitchen and finance in one place, encrypted on your device before it's saved." />

    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="The Chronicles book mark" />

    <meta name="twitter:title" content="Chronicles — Zero-Knowledge Encrypted Journal &amp; Digital Day Planner" />
    <meta name="twitter:description" content="A private life dashboard: journal, health, planning, kitchen and finance in one place, encrypted on your device before it's saved." />
    <meta name="twitter:image" content="https://mydailychronicles.com/icons/icon-512x512.png" />
    <meta name="twitter:image:alt" content="The Chronicles book mark" />

    <!-- Structured data for search engines and AI assistants: who makes it, the site, and the app -->

          "email": "support@mydailychronicles.com"
        },
        {
          "@type": "WebSite",
          "@id": "https://mydailychronicles.com/#website",
          "url": "https://mydailychronicles.com/",
          "name": "Chronicles",
          "description": "A zero-knowledge encrypted journal and digital day planner.",
          "publisher": { "@id": "https://mydailychronicles.com/#organization" },
          "inLanguage": "en-US"
        },
        {
          "@type": "WebApplication",
          "@id": "https://mydailychronicles.com/#app",
          "name": "Chronicles",
          "url": "https://mydailychronicles.com/",
          "applicationCategory": "LifestyleApplication",
          "operatingSystem": "Web browser; installable as an app on iPhone, iPad, Android and desktop",
          "description": "Chronicles is a private life dashboard. It brings a journal, health tracking, goals and planning, a kitchen, finance and a media journal into one place, and encrypts everything on your own device before it is saved, so the server can't read it.",
          "featureList": [
            "Zero-knowledge encryption: entries are encrypted on your device with AES-256 before they are saved",
            "Journal with rich text, drawing, dictation and photos",
            "Daily dashboard with an agenda, priorities, wins and quick entry",
            "Health tracking: meals and nutrition, medications and doses, symptoms, exercise, sleep, mood, water and cycle",
            "Health reports that look for patterns",
            "Goals, milestones, tasks, a planner, a roadmap and habits",

            "Kitchen: recipes, weekly menus and shopping lists",
            "Optional finance: budget, bills, spending, savings and debts, entered by hand",
            "Media journal for books, movies, TV and music, with an optional public shelf",
            "Optional in-app AI using your own provider key",
            "Passkeys and two-factor sign-in"

          "publisher": { "@id": "https://mydailychronicles.com/#organization" },
          "isPartOf": { "@id": "https://mydailychronicles.com/#website" }

    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Who is Chronicles for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Chronicles is designed for people who want to track their daily activities, goals, health, and schedule quickly without the overhead of heavy journaling."
          }
        },
        {
          "@type": "Question",
          "name": "Is my data private on Chronicles?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Chronicles uses zero-knowledge AES-256 encryption on your device. Your data is encrypted before saving, and servers cannot read your entries."
          }
        },
        {
          "@type": "Question",
          "name": "Does Chronicles cost anything to join?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Chronicles is currently accepting signups for its private beta testing phase."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
