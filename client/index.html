<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/chronicles-logo.svg?v=11" />
    <link rel="alternate icon" href="/favicon.ico?v=11" />
    <!-- Light until the app starts: main.tsx switches to the remembered theme before it paints -->
    <meta name="theme-color" content="#fef9f5" />
    <style>html { background: #fef9f5; }</style>
    <meta name="description" content="Capture your day in seconds. Chronicles is a zero-knowledge encrypted digital planner featuring health tracking, calendar sync, and optional private AI." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <!-- Public pages (LegalTemplate) point this at their own address -->
    <link rel="canonical" href="https://mydailychronicles.com/" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=11" />
    <!-- All fonts, the Material Symbols icons included, are bundled (src/styles/fonts.css) -->
    <title>Chronicles — Zero-Knowledge Encrypted Journal &amp; Digital Day Planner</title>
    <meta name="application-name" content="Chronicles" />
    <meta name="author" content="Chronicles" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage, Slack… link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chronicles" />
    <meta property="og:url" content="https://mydailychronicles.com/" />
    <meta property="og:title" content="Chronicles — Zero-Knowledge Encrypted Journal &amp; Digital Day Planner" />
    <meta property="og:description" content="A private life dashboard: journal, health, planning, kitchen and finance in one place, encrypted on your device before it's saved." />
    <meta property="og:image" content="https://mydailychronicles.com/icons/icon-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="The Chronicles book mark" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Chronicles — Zero-Knowledge Encrypted Journal &amp; Digital Day Planner" />
    <meta name="twitter:description" content="A private life dashboard: journal, health, planning, kitchen and finance in one place, encrypted on your device before it's saved." />
    <meta name="twitter:image" content="https://mydailychronicles.com/icons/icon-512x512.png" />
    <meta name="twitter:image:alt" content="The Chronicles book mark" />

    <!-- Structured data for search engines and AI assistants: who makes it, the site, and the app -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://mydailychronicles.com/#organization",
          "name": "Chronicles",
          "url": "https://mydailychronicles.com/",
          "logo": "https://mydailychronicles.com/icons/icon-512x512.png",
          "email": "support@mydailychronicles.com"
        },
        {
          "@type": "WebSite",
          "@id": "https://mydailychronicles.com/#website",
          "url": "https://mydailychronicles.com/",
          "name": "Chronicles",
          "description": "A zero-knowledge encrypted journal and digital day planner.",
          "publisher": { "@id": "https://mydailychronicles.com/#organization" },
          "inLanguage": "en-US"
        },
        {
          "@type": "WebApplication",
          "@id": "https://mydailychronicles.com/#app",
          "name": "Chronicles",
          "url": "https://mydailychronicles.com/",
          "applicationCategory": "LifestyleApplication",
          "operatingSystem": "Web browser; installable as an app on iPhone, iPad, Android and desktop",
          "description": "Chronicles is a private life dashboard. It brings a journal, health tracking, goals and planning, a kitchen, finance and a media journal into one place, and encrypts everything on your own device before it is saved, so the server can't read it.",
          "featureList": [
            "Zero-knowledge encryption: entries are encrypted on your device with AES-256 before they are saved",
            "Journal with rich text, drawing, dictation and photos",
            "Daily dashboard with an agenda, priorities, wins and quick entry",
            "Health tracking: meals and nutrition, medications and doses, symptoms, exercise, sleep, mood, water and cycle",
            "Health reports that look for patterns",
            "Goals, milestones, tasks, a planner, a roadmap and habits",
            "Calendar with events and meetings, and optional Google Calendar sync",
            "Kitchen: recipes, weekly menus and shopping lists",
            "Optional finance: budget, bills, spending, savings and debts, entered by hand",
            "Media journal for books, movies, TV and music, with an optional public shelf",
            "Optional in-app AI using your own provider key, with task planning and journal insights that ask before anything is shared",
            "Passkeys and two-factor sign-in"
          ],
          "publisher": { "@id": "https://mydailychronicles.com/#organization" },
          "isPartOf": { "@id": "https://mydailychronicles.com/#website" }
        }
      ]
    }
    </script>
    <!-- The FAQ, exactly as the landing page shows it (QUESTIONS in LandingView.tsx; the price is BETA_DETAILS.priceMonthly) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What will it cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "During active beta, access is completely free. After official release, pricing will be no more than $15 a month."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a phone app?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, and it is already in progress. Today Chronicles runs in any modern browser and installs to your phone’s home screen. The phone app itself will not be a copy of the desktop app. Planning a roadmap or laying out a week is hard on a small screen, which is why that work belongs on a desktop. The phone app is built around talking instead. Tell it to log a dose or add a habit, talk through your day, ask for the weather, or have it read your agenda back when you have forgotten something. It is a full assistant that knows your day and what matters to you. It signs in with your Chronicles name and password and works as an extension of it. You decide what it can see, with settings for exactly that, and there are manual controls for anyone who would rather not use AI at all. It starts on iPhone, with Android to follow. A desktop app is under development too, so you can sign in to an app for your planning instead of the web. Getting these right takes time. Expect six to eight months at least, and the pace will depend on how many people join the beta. We think it is where this is going."
          }
        },
        {
          "@type": "Question",
          "name": "Can I import my existing notes or journal entries?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. You can import entries from a CSV file, and export everything, as JSON and CSV, anytime."
          }
        },
        {
          "@type": "Question",
          "name": "What happens if I lose my password?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Because Chronicles uses zero-knowledge client-side encryption where your password and keys never leave your device, we can’t recover or reset your password for you. The recovery key you save when you sign up lets you set a new one. Without your password or that key, your journal can’t be opened."
          }
        },
        {
          "@type": "Question",
          "name": "How does optional AI work without compromising privacy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You bring your own API key (Anthropic, OpenAI or Amazon Bedrock), and requests go from your browser straight to that provider, never through Chronicles. Calorie and nutrient estimates and the chat only see what you type into them. AI planning and journal insights are the two features that send your entries, and both are off until you turn them on. Before every run they list exactly what will be shared and wait for your OK. Anything you send leaves Chronicles’ encryption and is handled under your provider’s terms, including whether it’s kept or used for training. Chronicles never stores the request or the answer."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
