<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Chronicles app icon (master, full bleed): the book_5 mark (Material Symbols, Apache 2.0) in a
       lavender to teal gradient on a dusk tile, violet at the top left easing to deep teal.
       The teal tile it replaced is kept in src/assets/app-icons/teal/. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2548"/><stop offset="0.45" stop-color="#1f3442"/>
      <stop offset="1" stop-color="#132128"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.1" cy="0" r="0.6">
      <stop offset="0" stop-color="#8a6fc8" stop-opacity="0.32"/><stop offset="1" stop-color="#8a6fc8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="0.75" r="0.55">
      <stop offset="0" stop-color="#34a5a2" stop-opacity="0.16"/><stop offset="1" stop-color="#34a5a2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="book" gradientUnits="userSpaceOnUse" x1="480" y1="-928" x2="480" y2="-80">
      <stop offset="0" stop-color="#ece4fb"/><stop offset="0.5" stop-color="#c9d6f0"/><stop offset="1" stop-color="#7fd3c9"/>
